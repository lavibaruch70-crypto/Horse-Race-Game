<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מרוץ סוסים בדואי 3D</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui {
            position: absolute; top: 20px; right: 20px;
            color: white; background: rgba(0,0,0,0.6);
            padding: 15px; border-radius: 8px; direction: rtl;
        }
        .bar { width: 200px; height: 15px; background: #555; margin-top: 5px; border-radius: 5px; }
        .fill { height: 100%; background: #4CAF50; width: 100%; border-radius: 5px; }
    </style>
    <!-- טעינת מנוע תלת ממד Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <h2>מרוץ נווה המדבר</h2>
        <div>מקשי תנועה: חצים / WASD | הליכה: Shift</div>
        <div style="margin-top: 10px;">מהירות: <span id="speed">0</span> קמ"ש</div>
        <div>סיבולת (Stamina):</div>
        <div class="bar"><div id="stamina" class="fill"></div></div>
    </div>
    <div id="canvas-container"></div>

<script>
// --- הגדרות סצינה ומצלמה ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xedc9af); // צבע שמיים מדברי
scene.fog = new THREE.FogExp2(0xedc9af, 0.008);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// --- תאורה ---
const ambientLight = new THREE.AmbientLight(0xffeedd, 0.7);
scene.add(ambientLight);

const sun = new THREE.DirectionalLight(0xffaa44, 1.2);
sun.position.set(100, 150, 50);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
scene.add(sun);

// --- קרקע המדבר ---
const terrainGeo = new THREE.PlaneGeometry(500, 500, 64, 64);
terrainGeo.rotateX(-Math.PI / 2);
const terrainMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.9 });
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
terrain.receiveShadow = true;
scene.add(terrain);

// --- אגם ומפל ---
const lakeGeo = new THREE.CircleGeometry(40, 32);
lakeGeo.rotateX(-Math.PI / 2);
const lakeMat = new THREE.MeshStandardMaterial({ color: 0x006699, roughness: 0.1, metalness: 0.8 });
const lake = new THREE.Mesh(lakeGeo, lakeMat);
lake.position.set(0, 0.1, 0);
scene.add(lake);

// סלעי מפל
const rockMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.8 });
const cliff = new THREE.Mesh(new THREE.BoxGeometry(30, 25, 10), rockMat);
cliff.position.set(0, 12.5, -45);
cliff.castShadow = true;
scene.add(cliff);

// מפל מים
const waterfallMat = new THREE.MeshStandardMaterial({ color: 0x66ccff, transparent: true, opacity: 0.8 });
const waterfall = new THREE.Mesh(new THREE.PlaneGeometry(12, 25), waterfallMat);
waterfall.position.set(0, 12.5, -39.9);
scene.add(waterfall);

// --- צמחייה בדואית (עצי תמר) ---
function createPalmTree(x, z) {
    const group = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 10), rockMat);
    trunk.position.y = 5;
    trunk.castShadow = true;
    group.add(trunk);

    const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57 });
    for(let i=0; i<5; i++) {
        const leaf = new THREE.Mesh(new THREE.BoxGeometry(1, 0.2, 6), leavesMat);
        leaf.position.set(0, 10, 2);
        leaf.rotation.x = 0.4;
        leaf.rotation.y = (i * Math.PI) / 2.5;
        group.add(leaf);
    }
    group.position.set(x, 0, z);
    scene.add(group);
}
// פיזור עצים סביב האגם
for(let i=0; i<12; i++) {
    let angle = (i / 12) * Math.PI * 2;
    createPalmTree(Math.cos(angle)*50, Math.sin(angle)*50);
}

// --- אלמנטים בדואיים: אוהל וג'יפ ---
// אוהל בדואי
const tentMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
const tent = new THREE.Mesh(new THREE.ConeGeometry(8, 5, 4), tentMat);
tent.position.set(60, 2.5, 20);
scene.add(tent);

// ג'יפ 4x4 פשוט
const jeepGroup = new THREE.Group();
const jeepBody = new THREE.Mesh(new THREE.BoxGeometry(4, 2, 7), new THREE.MeshStandardMaterial({ color: 0x556b2f }));
jeepBody.position.y = 1.5;
jeepGroup.add(jeepBody);
jeepGroup.position.set(-40, 0, 30);
scene.add(jeepGroup);

// --- הסוס (דמות השחקן) ---
const horseGroup = new THREE.Group();
const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.8, 3.5), new THREE.MeshStandardMaterial({ color: 0x8b4513 }));
bodyMesh.position.y = 2;
bodyMesh.castShadow = true;
horseGroup.add(bodyMesh);

const headMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 1.8), new THREE.MeshStandardMaterial({ color: 0x5c2e0b }));
headMesh.position.set(0, 3.2, 1.5);
horseGroup.add(headMesh);

horseGroup.position.set(0, 0, 80);
scene.add(horseGroup);

// --- בקרה ותנועה ---
const keys = {};
let speed = 0;
let stamina = 100;
const maxSpeed = 0.8;

window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function updateGame() {
    // שליטה במהירות
    if ((keys['arrowup'] || keys['w'])) {
        let isSprinting = keys['shift'] && stamina > 0;
        let targetSpeed = isSprinting ? maxSpeed * 1.5 : maxSpeed;
        speed = THREE.MathUtils.lerp(speed, targetSpeed, 0.05);

        if (isSprinting) {
            stamina = Math.max(0, stamina - 0.4);
        }
    } else {
        speed = THREE.MathUtils.lerp(speed, 0, 0.05);
    }

    // התאוששות סיבולת
    if (!keys['shift'] && stamina < 100) {
        stamina = Math.min(100, stamina + 0.2);
    }

    // פנייה
    if (keys['arrowleft'] || keys['a']) horseGroup.rotation.y += 0.03;
    if (keys['arrowright'] || keys['d']) horseGroup.rotation.y -= 0.03;

    // התקדמות
    horseGroup.translateZ(speed);

    // עדכון מצלמה (מעקב גוף שלישי)
    const relativeCameraOffset = new THREE.Vector3(0, 5, -12);
    const cameraOffset = relativeCameraOffset.applyMatrix4(horseGroup.matrixWorld);
    camera.position.x = THREE.MathUtils.lerp(camera.position.x, cameraOffset.x, 0.1);
    camera.position.y = THREE.MathUtils.lerp(camera.position.y, cameraOffset.y, 0.1);
    camera.position.z = THREE.MathUtils.lerp(camera.position.z, cameraOffset.z, 0.1);
    camera.lookAt(horseGroup.position.x, horseGroup.position.y + 2, horseGroup.position.z);

    // עדכון UI
    document.getElementById('speed').innerText = Math.round(speed * 100);
    document.getElementById('stamina').style.width = stamina + '%';
}

// לולאת רינדור
function animate() {
    requestAnimationFrame(animate);
    updateGame();
    renderer.render(scene, camera);
}
animate();

// התאמת חלון
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
